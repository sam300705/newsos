name: NewsOS Release Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main, "feat/**", "phase*/**", "release/**"]
  push:
    branches: [main, "feat/**", "phase*/**", "release/**"]

concurrency:
  group: newsos-release-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
  SUPABASE_SECRET_KEY: sb_secret_ci_placeholder
  NEXT_PUBLIC_SITE_URL: https://newsos.example.com
  NEXT_PUBLIC_BRAND_NAME: NewsOS
  NEXT_PUBLIC_PUBLISHER_NAME: NewsOS
  NEXT_PUBLIC_CONTACT_EMAIL: newsroom@example.com
  CRON_SECRET: ci_only_long_random_placeholder_123456789
  TAVILY_API_KEY: tvly_ci_placeholder
  LLM_BASE_URL: https://api.openai.com/v1
  LLM_API_KEY: ci_placeholder
  LLM_MODEL: ci-model
  LLM_EMBEDDING_MODEL: ci-embedding-model

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout event commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.16.0"

      - name: Pin npm and identify candidate
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@10.9.2 --no-audit --no-fund
          test "$(node --version)" = "v22.16.0"
          test "$(npm --version)" = "10.9.2"
          git ls-files --error-unmatch package-lock.json
          {
            echo "## Release candidate"
            echo "Checked-out SHA: $(git rev-parse HEAD)"
            echo "Event SHA: ${{ github.sha }}"
            echo "PR head SHA: ${{ github.event.pull_request.head.sha }}"
            echo "Node: $(node --version); npm: $(npm --version)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean install
        run: npm ci --no-audit --no-fund

      - name: Offline trust and security contracts
        run: npm run verify:offline

      - name: Embedded migration and permissions tests
        run: npm run test:db

      - name: Database type drift
        run: npm run db:types:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Vitest
        run: npm run test:run

      - name: Production build
        run: npm run build

      - name: Verify lockfile and report tracked changes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- package.json package-lock.json
          {
            echo "## Working tree after verification"
            echo '```'
            git status --short
            echo '```'
            echo "Next.js may generate next-env.d.ts and tsconfig.json changes during build."
            echo "These are reported, never committed or pushed by CI."
          } >> "$GITHUB_STEP_SUMMARY"
