name: Phase 0 Release Gate

on:
  workflow_dispatch:
  push:
    branches:
      - feat/phases-1-16
    paths-ignore:
      - "package-lock.json"

concurrency:
  group: phase0-release-gate
  cancel-in-progress: true

permissions:
  contents: write

env:
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
  SUPABASE_SECRET_KEY: sb_secret_ci_placeholder
  NEXT_PUBLIC_SITE_URL: https://newsos.example.com
  NEXT_PUBLIC_BRAND_NAME: NewsOS
  NEXT_PUBLIC_PUBLISHER_NAME: NewsOS
  NEXT_PUBLIC_CONTACT_EMAIL: newsroom@example.com
  CRON_SECRET: ci_only_long_random_placeholder_123456789
  TAVILY_API_KEY: tvly_ci_placeholder
  LLM_BASE_URL: https://api.openai.com/v1
  LLM_API_KEY: ci_placeholder
  LLM_MODEL: ci-model
  LLM_EMBEDDING_MODEL: ci-embedding-model

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/phases-1-16

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Generate deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Clean install
        run: npm ci --no-audit --no-fund

      - name: Offline trust and security contracts
        run: npm run verify:offline

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Vitest
        run: npm run test:run

      - name: Production build
        run: npm run build

      - name: Commit lockfile if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock dependencies after phase 0 release gate"
          fi
          git fetch origin feat/phases-1-16
          git rebase origin/feat/phases-1-16
          git push origin HEAD:feat/phases-1-16
