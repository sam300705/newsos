name: NewsOS Database Verification
on:
  workflow_dispatch:
  pull_request:
    branches: [main, "feat/**", "phase*/**", "release/**"]
  push:
    branches: [main, "feat/**", "phase*/**", "release/**"]
permissions:
  contents: read
concurrency:
  group: newsos-db-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  supabase-database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@d347ba47d3fb7eeeddbbc793bc8d4779caf773ea # v1.5.0
        with:
          version: 2.75.0
      - name: Start disposable Supabase
        run: supabase start
      - name: Replay migrations and test actual DB roles/RLS
        run: bash scripts/db/test-supabase.sh
      - name: Stop disposable Supabase
        if: always()
        run: supabase stop --no-backup
